# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: VotedForUs/site
  branch: main

media_folder: src/content/media
public_folder: /content/media
site_url: https://localhost:4321
local_backend: true

slug:
  lowercase: false

singletons:
  - name: acronyms
    label: Acronym Dictionary
    file: src/content/editorial/acronyms.json
    extension: json
    format: json
    fields:
      - name: acronyms
        label: Acronyms
        widget: list
        summary: "{{acronym}} — {{name}}"
        fields:
          - { label: Acronym, name: acronym, widget: string }
          - { label: Organization, name: name, widget: string }

collections:
  - name: voteactions
    label: "Vote Actions"
    label_singular: "Vote Action"
    folder: src/content/editorial/vote-actions
    extension: json
    format: json
    create: true
    delete: false
    slug: '{{voteId}}'
    identifier_field: voteId
    summary: "{{voteId}} - {{action}}"
    fields:
      - { label: Vote ID, name: voteId, widget: string }
      - { label: Action, name: action, widget: string }

  - name: titles
    label: "Titles"
    label_singular: "Title"
    folder: src/content/editorial/bill-titles
    extension: json
    format: json
    create: true
    delete: false
    slug: '{{billId}}'
    identifier_field: billId
    summary: "{{billId}} - {{title}}"
    fields:
      - { label: Bill ID, name: billId, widget: string }
      - { label: Title, name: title, widget: string, required: false }
