name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.*'
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: 'Rebuild all pages (use after layout/component changes)'
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@votedforus'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}

      # Tier 1: Restore Astro data-store cache.
      # Uses run-ID key + prefix restore so we always get the most recent warm cache.
      # The digest comparison inside loaders handles entry-level freshness.
      - name: Restore Astro data-store cache
        uses: actions/cache@v5
        with:
          path: .astro/
          key: astro-data-prod-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            astro-data-prod-${{ runner.os }}-

      # Tier 2: Restore dist cache (production only — isolated from CI test builds).
      # Contains the previous build's HTML output + .astro-manifest.json for
      # the incremental-check script to diff against.
      # Skip on a full rebuild: ubuntu-latest has ~14 GB disk, and the old
      # cache plus a new 200k-page dist will not both fit. Merge is skipped
      # anyway when FORCE_FULL_REBUILD is set.
      - name: Restore dist cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.force_full_rebuild != true }}
        uses: actions/cache@v5
        with:
          path: dist-cache/
          key: astro-dist-prod-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            astro-dist-prod-${{ runner.os }}-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Compute source-file hashes, diff against dist-cache/.astro-manifest.json,
      # write src/data/.build-manifest.json for getStaticPaths to consume.
      # Also writes .current-digests.json for post-build to save as next run's manifest.
      - name: Run incremental build check
        env:
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
        run: npx tsx scripts/incremental-check.ts

      # Incremental: `npm run build` (check → astro → merge cache → save).
      # Full rebuild: finder index + astro only. Do not restore or copy
      # dist-cache during emit — that is what filled the 14 GB runner last time.
      - name: Build site
        env:
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          df -h
          if [ "$FORCE_FULL_REBUILD" = "true" ]; then
            npm run finder:index
            npx astro build
            test ! -d dist/v
          else
            npm run build
          fi
          df -h

      # Merge pages from the previous build that were NOT regenerated this build.
      # --ignore-existing ensures we never overwrite freshly-built pages.
      - name: Merge cached pages into dist
        run: |
          if [ -d dist-cache ] && [ "${{ inputs.force_full_rebuild }}" != "true" ]; then
            rsync -a --ignore-existing dist-cache/ dist/
          fi

      # Replace dist-cache with this run's complete dist. A merge-copy left
      # deleted families (old /v/ HTML) in the Actions cache for the next rsync.
      - name: Update dist-cache and save manifest
        run: |
          rm -rf dist-cache
          mkdir -p dist-cache
          cp -al dist/. dist-cache/ || cp -a dist/. dist-cache/
          if [ -f .current-digests.json ]; then
            cp .current-digests.json dist-cache/.astro-manifest.json
          fi
          test ! -d dist/v && test ! -d dist-cache/v

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 3600000
